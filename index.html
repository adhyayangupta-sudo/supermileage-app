<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get the SuperMileage app</title>
<script>
  (function () {
    var PLAY = "https://play.google.com/store/apps/details?id=in.supermileage";
    var IOS = "https://apps.apple.com/in/app/supermileage/id6753735437";
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS) { window.location.replace(IOS); }
    else if (/Android/i.test(ua)) { window.location.replace(PLAY); }
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFF8EE;color:#232F3E;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-size:26px;margin:0 0 8px} p{color:#565959;margin:0 0 24px}
  a{display:block;margin:12px auto;max-width:280px;padding:16px 20px;border-radius:999px;background:#FF9900;color:#0F1111;
    font-weight:700;text-decoration:none}
  a.alt{background:#232F3E;color:#fff}
</style>
</head>
<body>
  <main>
    <h1>Get the SuperMileage app</h1>
    <p>Prepaid fuel wallet for fleets</p>
    <a href="https://play.google.com/store/apps/details?id=in.supermileage">Get it on Google Play</a>
    <a class="alt" href="https://apps.apple.com/in/app/supermileage/id6753735437">Download on the App Store</a>
  </main>
</body>
</html>
